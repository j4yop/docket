<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="430" viewBox="0 0 1760 430" role="img" aria-labelledby="title desc">
  <title id="title">Docket Automated Publish Gate Pipeline</title>
  <desc id="desc">Policy inputs pass through deterministic authority resolution, then Clocked Protect, Guard, Inspect, Rerank, Compare, Fill and Verify before a Publish, Rewrite or Hold verdict.</desc>
  <rect width="1760" height="430" rx="18" fill="#08090A"/>
  <rect x="1" y="1" width="1758" height="428" rx="17" fill="none" stroke="#2A302D"/>

  <text x="64" y="62" fill="#F5F7F5" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6">Docket — automated publish gate</text>
  <text x="64" y="92" fill="#9AA5A1" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="15">Authority is resolved before any model judgment. Every Clocked output changes what the gate does.</text>

  <!-- input chips -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13">
    <rect x="64" y="124" width="96" height="34" rx="6" fill="#121716" stroke="#2A302D"/>
    <text x="112" y="146" text-anchor="middle" fill="#D9DEDC">Policies</text>
    <rect x="172" y="124" width="96" height="34" rx="6" fill="#121716" stroke="#2A302D"/>
    <text x="220" y="146" text-anchor="middle" fill="#D9DEDC">Context</text>
    <rect x="280" y="124" width="104" height="34" rx="6" fill="#121716" stroke="#2A302D"/>
    <text x="332" y="146" text-anchor="middle" fill="#D9DEDC">Question</text>
    <rect x="396" y="124" width="88" height="34" rx="6" fill="#121716" stroke="#2A302D"/>
    <text x="440" y="146" text-anchor="middle" fill="#D9DEDC">Draft</text>
  </g>
  <path d="M496 141 H540" stroke="#4F5553" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- group labels -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">
    <text x="712" y="104" fill="#FF6B6F">SAFETY</text>
    <text x="1196" y="104" fill="#6FE3B0">KNOWLEDGE</text>
    <text x="1512" y="104" fill="#E2A65A">DECISIONS</text>
  </g>

  <!-- stage boxes -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">
    <!-- Authority -->
    <rect x="540" y="124" width="142" height="84" rx="8" fill="#121716" stroke="#4F5553"/>
    <rect x="540" y="124" width="142" height="4" rx="2" fill="#F5F7F5"/>
    <text x="611" y="157" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Authority</text>
    <text x="611" y="178" text-anchor="middle" fill="#9AA5A1" font-size="12">jurisdiction · precedence</text>
    <text x="611" y="195" text-anchor="middle" fill="#9AA5A1" font-size="12">valid time</text>

    <!-- Protect -->
    <rect x="712" y="124" width="128" height="84" rx="8" fill="#121716" stroke="#FF3350"/>
    <rect x="712" y="124" width="128" height="4" rx="2" fill="#FF3350"/>
    <text x="776" y="157" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Protect</text>
    <text x="776" y="178" text-anchor="middle" fill="#9AA5A1" font-size="12">PII redaction</text>
    <text x="776" y="195" text-anchor="middle" fill="#9AA5A1" font-size="12">/clocked/pii</text>

    <!-- Guard -->
    <rect x="870" y="124" width="128" height="84" rx="8" fill="#121716" stroke="#FF3350"/>
    <rect x="870" y="124" width="128" height="4" rx="2" fill="#FF3350"/>
    <text x="934" y="157" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Guard</text>
    <text x="934" y="178" text-anchor="middle" fill="#9AA5A1" font-size="12">injection</text>
    <text x="934" y="195" text-anchor="middle" fill="#9AA5A1" font-size="12">/clocked/injection</text>

    <!-- Inspect -->
    <rect x="1028" y="124" width="128" height="84" rx="8" fill="#121716" stroke="#FF3350"/>
    <rect x="1028" y="124" width="128" height="4" rx="2" fill="#FF3350"/>
    <text x="1092" y="157" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Inspect</text>
    <text x="1092" y="178" text-anchor="middle" fill="#9AA5A1" font-size="12">script safety</text>
    <text x="1092" y="195" text-anchor="middle" fill="#9AA5A1" font-size="12">/clocked/script</text>

    <!-- Rerank -->
    <rect x="1196" y="124" width="128" height="84" rx="8" fill="#121716" stroke="#00D697"/>
    <rect x="1196" y="124" width="128" height="4" rx="2" fill="#00D697"/>
    <text x="1260" y="157" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Rerank</text>
    <text x="1260" y="178" text-anchor="middle" fill="#9AA5A1" font-size="12">governing clauses</text>
    <text x="1260" y="195" text-anchor="middle" fill="#9AA5A1" font-size="12">/clocked/rerank</text>

    <!-- Compare -->
    <rect x="1354" y="124" width="128" height="84" rx="8" fill="#121716" stroke="#00D697"/>
    <rect x="1354" y="124" width="128" height="4" rx="2" fill="#00D697"/>
    <text x="1418" y="157" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Compare</text>
    <text x="1418" y="178" text-anchor="middle" fill="#9AA5A1" font-size="12">conflicts</text>
    <text x="1418" y="195" text-anchor="middle" fill="#9AA5A1" font-size="12">/clocked/compare</text>

    <!-- Fill -->
    <rect x="1512" y="124" width="128" height="84" rx="8" fill="#121716" stroke="#E2A65A"/>
    <rect x="1512" y="124" width="128" height="4" rx="2" fill="#E2A65A"/>
    <text x="1576" y="157" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Fill</text>
    <text x="1576" y="178" text-anchor="middle" fill="#9AA5A1" font-size="12">omission check</text>
    <text x="1576" y="195" text-anchor="middle" fill="#9AA5A1" font-size="12">/clocked/fill</text>
  </g>

  <!-- stage arrows -->
  <g stroke="#4F5553" stroke-width="2" marker-end="url(#arrow)">
    <path d="M682 166 H712"/>
    <path d="M840 166 H870"/>
    <path d="M998 166 H1028"/>
    <path d="M1156 166 H1196"/>
    <path d="M1324 166 H1354"/>
    <path d="M1482 166 H1512"/>
  </g>

  <!-- second row: Verify + Verdict -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">
    <rect x="1196" y="256" width="128" height="84" rx="8" fill="#121716" stroke="#00D697"/>
    <rect x="1196" y="256" width="128" height="4" rx="2" fill="#00D697"/>
    <text x="1260" y="289" text-anchor="middle" fill="#F5F7F5" font-size="16" font-weight="700">Verify</text>
    <text x="1260" y="310" text-anchor="middle" fill="#9AA5A1" font-size="12">claim grounding</text>
    <text x="1260" y="327" text-anchor="middle" fill="#9AA5A1" font-size="12">/clocked/grounding</text>

    <rect x="1400" y="256" width="240" height="84" rx="8" fill="#121716" stroke="#F5F7F5"/>
    <rect x="1400" y="256" width="240" height="4" rx="2" fill="#F5F7F5"/>
    <text x="1520" y="287" text-anchor="middle" fill="#F5F7F5" font-size="17" font-weight="700">Verdict</text>
    <text x="1520" y="310" text-anchor="middle" fill="#9AA5A1" font-size="12">deterministic, fail-closed</text>
    <text x="1520" y="329" text-anchor="middle" fill="#F5F7F5" font-size="12" font-weight="700">PUBLISH · REWRITE · HOLD</text>
  </g>
  <path d="M1640 166 V232 H1324 V256" fill="none" stroke="#4F5553" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1324 298 H1400" stroke="#4F5553" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="64" y="302" fill="#6F7A76" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13">Missing, failed, or out-of-range judgment fails closed to HOLD. No endpoint output is decorative.</text>
  <text x="64" y="328" fill="#6F7A76" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="13">Safety: Protect · Guard · Inspect  |  Knowledge: Rerank · Compare · Verify  |  Decisions: Fill</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F5553"/>
    </marker>
  </defs>
</svg>
