<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Docket automated publish gate pipeline</title>
  <desc id="desc">Policy integrity and deterministic authority resolve first, then nine Clocked endpoints across safety, decisions, and knowledge, then a fail-closed verdict and a hash-chained audit ledger.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6a62"/>
    </marker>
    <style>
      .bg { fill: #0a0a0b; }
      .panel { fill: #121214; stroke: #2a2a2d; stroke-width: 1; }
      .panel-accent { fill: #141416; stroke: #ff1f3d; stroke-width: 1.2; }
      .input { fill: #171719; stroke: #2a2a2d; stroke-width: 1; }
      .title { fill: #f4f1ea; font-family: Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
      .sub { fill: #a9a39a; font-family: Helvetica, Arial, sans-serif; font-size: 13px; }
      .group { fill: #6f6a62; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 1.6px; }
      .name { fill: #f4f1ea; font-family: Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .role { fill: #a9a39a; font-family: Helvetica, Arial, sans-serif; font-size: 11.5px; }
      .path { fill: #6f6a62; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; }
      .red { fill: #ff1f3d; }
      .green { fill: #4ade80; }
      .amber { fill: #f5b544; }
      .line { stroke: #3a3a3d; stroke-width: 1; fill: none; marker-end: url(#arrow); }
      .footer { fill: #6f6a62; font-family: Helvetica, Arial, sans-serif; font-size: 11px; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="640"/>

  <text class="title" x="48" y="52">Docket — the publish gate with a receipt</text>
  <text class="sub" x="48" y="76">Policy integrity and authority resolve before any model judgment. Every Clocked output changes the record, the evidence, or the verdict.</text>

  <!-- inputs -->
  <rect class="input" x="48" y="100" width="246" height="50" rx="4"/>
  <text class="name" x="66" y="122" style="font-size:13px">Policies + envelopes</text>
  <text class="path" x="66" y="139">approved · hashed · signed</text>

  <rect class="input" x="316" y="100" width="246" height="50" rx="4"/>
  <text class="name" x="334" y="122" style="font-size:13px">Employee context</text>
  <text class="path" x="334" y="139">country · role · plan</text>

  <rect class="input" x="584" y="100" width="246" height="50" rx="4"/>
  <text class="name" x="602" y="122" style="font-size:13px">Question</text>
  <text class="path" x="602" y="139">what the employee asked</text>

  <rect class="input" x="852" y="100" width="300" height="50" rx="4"/>
  <text class="name" x="870" y="122" style="font-size:13px">Draft answer</text>
  <text class="path" x="870" y="139">what the assistant is about to send</text>

  <!-- authority -->
  <rect class="panel-accent" x="48" y="184" width="1104" height="64" rx="4"/>
  <text class="group" x="66" y="207">DETERMINISTIC · NO MODEL CALL</text>
  <text class="name" x="66" y="228">Policy integrity + authority resolver</text>
  <text class="role" x="470" y="228">SHA-256 / HMAC envelope check → jurisdiction → precedence → effective date → expiry → applicable clauses</text>
  <text class="path" x="470" y="242" style="fill:#ff1f3d">unapproved · tampered · metadata conflict · not in force · unresolved tie = HOLD</text>

  <path class="line" d="M 600 150 L 600 184"/>

  <!-- group headers -->
  <text class="group" x="48" y="286">SAFETY</text>
  <text class="group" x="430" y="286">DECISIONS</text>
  <text class="group" x="812" y="286">KNOWLEDGE</text>

  <!-- safety -->
  <rect class="panel" x="48" y="300" width="340" height="54" rx="4"/>
  <text class="name" x="66" y="322">Protect</text>
  <text class="role" x="150" y="322">redacts the audit preview</text>
  <text class="path" x="66" y="339">/clocked/pii · record, not verdict</text>

  <rect class="panel" x="48" y="366" width="340" height="54" rx="4"/>
  <text class="name" x="66" y="388">Guard</text>
  <text class="role" x="150" y="388">screens source + draft</text>
  <text class="path" x="66" y="405">/clocked/injection · HOLD on injection</text>

  <rect class="panel" x="48" y="432" width="340" height="54" rx="4"/>
  <text class="name" x="66" y="454">Inspect</text>
  <text class="role" x="150" y="454">reviews runbook scripts</text>
  <text class="path" x="66" y="471">/clocked/script · HOLD on unsafe script</text>

  <!-- decisions -->
  <rect class="panel" x="430" y="300" width="340" height="54" rx="4"/>
  <text class="name" x="448" y="322">Extract</text>
  <text class="role" x="532" y="322">verifies policy facts</text>
  <text class="path" x="448" y="339">/clocked/extract · HOLD on metadata conflict</text>

  <rect class="panel" x="430" y="366" width="340" height="54" rx="4"/>
  <text class="name" x="448" y="388">Decide</text>
  <text class="role" x="532" y="388">triages + routes review</text>
  <text class="path" x="448" y="405">/clocked/decide · HOLD when review required</text>

  <rect class="panel" x="430" y="432" width="340" height="54" rx="4"/>
  <text class="name" x="448" y="454">Fill</text>
  <text class="role" x="532" y="454">finds material omissions</text>
  <text class="path" x="448" y="471">/clocked/fill · REWRITE on coverage gap</text>

  <!-- knowledge -->
  <rect class="panel" x="812" y="300" width="340" height="54" rx="4"/>
  <text class="name" x="830" y="322">Rerank</text>
  <text class="role" x="914" y="322">selects governing clauses</text>
  <text class="path" x="830" y="339">/clocked/rerank · evidence set</text>

  <rect class="panel" x="812" y="366" width="340" height="54" rx="4"/>
  <text class="name" x="830" y="388">Compare</text>
  <text class="role" x="914" y="388">catches superseded values</text>
  <text class="path" x="830" y="405">/clocked/compare · REWRITE when used</text>

  <rect class="panel" x="812" y="432" width="340" height="54" rx="4"/>
  <text class="name" x="830" y="454">Verify</text>
  <text class="role" x="914" y="454">grounds every claim</text>
  <text class="path" x="830" y="471">/clocked/grounding · REWRITE / HOLD</text>

  <!-- connections -->
  <path class="line" d="M 218 248 L 218 300"/>
  <path class="line" d="M 600 248 L 600 300"/>
  <path class="line" d="M 982 248 L 982 300"/>

  <!-- verdict -->
  <rect class="panel-accent" x="48" y="510" width="1104" height="58" rx="4"/>
  <text class="group" x="66" y="532">DETERMINISTIC · FAIL-CLOSED</text>
  <text class="name" x="66" y="553">Verdict policy</text>
  <text class="role" x="210" y="553">ordered rules over verified evidence</text>
  <text class="path" x="560" y="553" style="fill:#4ade80">PUBLISH</text>
  <text class="path" x="640" y="553" style="fill:#f5b544">· REWRITE</text>
  <text class="path" x="738" y="553" style="fill:#ff1f3d">· HOLD</text>
  <text class="path" x="830" y="553">· audit write failed = HOLD</text>

  <path class="line" d="M 218 486 L 218 510"/>
  <path class="line" d="M 600 486 L 600 510"/>
  <path class="line" d="M 982 486 L 982 510"/>

  <!-- audit -->
  <rect class="panel" x="48" y="584" width="1104" height="38" rx="4"/>
  <text class="group" x="66" y="608">AUDIT LEDGER</text>
  <text class="footer" x="190" y="608">signed policy envelopes · decision · codes · citations · credits · latency · prev_hash → record_hash · /ledger verifies the chain</text>

  <text class="footer" x="48" y="636" style="font-size:10px">37-case live benchmark: 100% decision accuracy · 0% clean false-HOLD · 0% unsafe false-PUBLISH · /ledger</text>
</svg>
